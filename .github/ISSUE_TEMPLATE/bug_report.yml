name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include commit SHA, environment, sanitized configuration, and minimal steps.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Trading or risk impact
      description: Could this affect orders, positions, balances, reconciliation, or limits?
    validations:
      required: true
