[workspace]
members = [
    "apps/quanthelm",
    "crates/qh-binance",
    "crates/qh-config",
    "crates/qh-domain",
    "crates/qh-exchange",
    "crates/qh-market-data",
    "crates/qh-risk",
    "crates/qh-storage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["QuantHelm contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ZqiEE/quanthelm"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1.36", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.12", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
correctness = "deny"
suspicious = "deny"
